<style>
  #srvmon-plugin { padding: 12px 16px 6px; font-size: 13px; }
  #srvmon-plugin .srvmon-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 10px; }
  #srvmon-plugin .srvmon-status { color: #687482; flex: 1; min-width: 260px; }
  #srvmon-plugin .srvmon-status.err { color: #c62828; }
  #srvmon-plugin select, #srvmon-plugin input { height: 30px; padding: 0 6px; border: 1px solid #dcdfe6; border-radius: 4px; }
  #srvmon-frame { display: block; width: 100%; border: 1px solid #e2e6eb; border-radius: 8px; background: #f5f6f8; }
</style>
<div id="srvmon-plugin">
  <div class="srvmon-bar">
    <label>Window <select id="srvmon-days"></select></label>
    <button type="button" class="btn btn-success btn-sm" id="srvmon-refresh">Refresh</button>
    <button type="button" class="btn btn-default btn-sm" id="srvmon-open">Open in new tab</button>
    <span class="srvmon-status" id="srvmon-status">Loading…</span>
    <label>Keep <input id="srvmon-retention" type="number" min="1" max="90" style="width:64px"> days</label>
    <button type="button" class="btn btn-default btn-sm" id="srvmon-save">Save</button>
  </div>
  <iframe id="srvmon-frame" title="srvmon dashboard"></iframe>
</div>
<script>
(function () {
  var lastHtml = "";
  var $status = $("#srvmon-status");

  function call(method, data, done) {
    $.post("/plugin?action=a&name=srvmon&s=" + method, data || {}, function (res) {
      if (typeof res === "string") { try { res = JSON.parse(res); } catch (e) { res = { status: false, msg: res }; } }
      done(res || { status: false, msg: "empty response" });
    }).fail(function (xhr) { done({ status: false, msg: "HTTP " + xhr.status }); });
  }

  function setStatus(text, isError) {
    $status.text(text).toggleClass("err", !!isError);
  }

  // The panel opens plugins in a 700px layui layer; give the dashboard most of the screen.
  function fit() {
    var $win = $(window), $layer = $("#srvmon-plugin").closest(".layui-layer");
    var width = Math.min(1360, $win.width() - 40), height = $win.height() - 40;
    if ($layer.length) {
      $layer.css({ width: width + "px", height: height + "px", left: ($win.width() - width) / 2 + "px", top: "20px" });
      var titleHeight = $layer.find(".layui-layer-title").outerHeight() || 0;
      $layer.find(".layui-layer-content").css({ height: height - titleHeight + "px", overflow: "auto" });
      height -= titleHeight;
    }
    var barHeight = $("#srvmon-plugin .srvmon-bar").outerHeight(true) || 50;
    $("#srvmon-frame").css("height", Math.max(420, height - barHeight - 30) + "px");
  }

  function fillDays(retention) {
    var current = parseInt($("#srvmon-days").val(), 10) || retention;
    var opts = [1, 3, 7, retention].filter(function (d, i, a) { return d <= retention && a.indexOf(d) === i; });
    opts.sort(function (a, b) { return a - b; });
    $("#srvmon-days").html(opts.map(function (d) {
      return '<option value="' + d + '">' + (d === 1 ? "Last 24 hours" : "Last " + d + " days") + "</option>";
    }).join("")).val(Math.min(current, retention));
  }

  function describe(info) {
    var age = info.last_native_age_s;
    var fresh = age == null ? "no collector samples yet" :
      age < 180 ? "last sample " + age + " s ago" : "last sample " + Math.round(age / 60) + " min ago (check the collector)";
    return info.samples.toLocaleString() + " samples, " + fresh + " · " + info.scheduler +
      " · " + Math.round(info.db_size_kb / 1024 * 10) / 10 + " MB";
  }

  function load() {
    setStatus("Loading…");
    call("get_dashboard", { days: $("#srvmon-days").val() || 7 }, function (res) {
      if (!res.status) { setStatus(res.msg || "Failed to load", true); return; }
      lastHtml = res.html;
      if (!$("#srvmon-days option").length) fillDays(res.info.retention_days);
      $("#srvmon-retention").val(res.info.retention_days);
      document.getElementById("srvmon-frame").srcdoc = res.html;
      setStatus(describe(res.info), res.info.last_native_age_s == null || res.info.last_native_age_s >= 180);
      fit();
    });
  }

  $("#srvmon-refresh").on("click", load);
  $("#srvmon-days").on("change", load);
  $("#srvmon-open").on("click", function () {
    if (!lastHtml) return;
    window.open(URL.createObjectURL(new Blob([lastHtml], { type: "text/html" })), "_blank");
  });
  $("#srvmon-save").on("click", function () {
    var days = parseInt($("#srvmon-retention").val(), 10);
    call("set_retention", { days: days }, function (res) {
      if (window.layer && layer.msg) layer.msg(res.msg, { icon: res.status ? 1 : 2 });
      if (res.status) { fillDays(days); load(); } else { setStatus(res.msg, true); }
    });
  });
  $(window).on("resize", fit);
  fit();
  load();
})();
</script>
